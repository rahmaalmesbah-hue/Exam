<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiX - Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark-theme text-white">

    <!-- Back Arrow Top-Left -->
    <a href="index.html" class="back-arrow" aria-label="Back to Home">
        <i class="fa-solid fa-arrow-left-long"></i>
    </a>

    <div class="overlay d-flex flex-column justify-content-center align-items-center p-3">
        <h1 class="brand-title mb-4">Login</h1>

        <!-- Start of Login Form -->
<form id="loginForm" onsubmit="event.preventDefault(); loginUser(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);">
    
    <!-- Email Field -->
    <div class="mb-3">
        <label for="loginEmail" class="form-label field-label">Email:</label>
        <input type="email" class="form-control custom-input" id="loginEmail" placeholder="Enter your email" required>
    </div>

    <!-- Password Field -->
    <div class="mb-4">
        <label for="loginPassword" class="form-label field-label">Password:</label>
        <input type="password" class="form-control custom-input" id="loginPassword" placeholder="Enter your password" required>
    </div>

    <!-- Error message displayed if account is not found (hidden by default) -->
    <div id="loginError" class="text-danger text-center fw-bold mb-3 d-none"></div>

    <!-- Login Button -->
    <div class="text-center mb-3">
        <button type="submit" class="btn btn-pill-white w-100 py-2 fw-bold">Submit</button>
    </div>

    <!-- Sign up link for users without an account -->
    <div class="text-center mt-3" style="color: white;">
        Don't have an account? <a href="signup.html" style="color: #b0c7d6; font-weight: bold; text-decoration: none;">Sign up</a>
    </div>

</form>
<!-- End of Login Form -->
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            loginUser(email, pass);
        });
    </script>
</body>
</html>
