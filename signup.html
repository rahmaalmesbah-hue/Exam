<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiX - Sign Up</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark-theme text-white">

    <!-- Back Arrow Top-Left -->
    <a href="login.html" class="back-arrow" aria-label="Back to Login">
        <i class="fa-solid fa-arrow-left-long"></i>
    </a>

    <div class="overlay d-flex flex-column justify-content-center align-items-center p-3">
        <h1 class="brand-title mb-4">Sign up</h1>

        <form id="signupForm" class="w-100 form-container-wide">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="signupName" class="form-label field-label">Name:</label>
                    <input type="text" class="form-control custom-input" id="signupName" required>
                </div>
                <div class="col-md-6">
                    <label for="signupEmail" class="form-label field-label">Email:</label>
                    <input type="email" class="form-control custom-input" id="signupEmail" required>
                </div>
                <div class="col-md-6">
                    <label for="signupPhone" class="form-label field-label">Phone:</label>
                    <input type="tel" class="form-control custom-input" id="signupPhone" required placeholder="+20##########">
                </div>
                <div class="col-md-6">
                    <label for="signupPassword" class="form-label field-label">Password:</label>
                    <input type="password" class="form-control custom-input" id="signupPassword" required>
                </div>
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-pill-white px-5 py-2 fw-bold">Submit</button>
            </div>
        </form>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const phone = document.getElementById('signupPhone').value;
            const pass = document.getElementById('signupPassword').value;
            registerUser(name, email, phone, pass);
        });
    </script>
</body>
</html>
